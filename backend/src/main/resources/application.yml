spring:
  application:
    name: remake
  profiles:
    active: local
  servlet:
    multipart:
      # 영수증은 10MB, 공유 사진은 서비스에서 별도로 5MiB까지 검사한다.
      max-file-size: 10MB
      max-request-size: 30MB

remake:
  upload:
    root-directory: ${REMAKE_UPLOAD_ROOT_DIRECTORY:${java.io.tmpdir}/remake-uploads}

logging:
  pattern:
    # 로그 줄마다 요청 추적 ID(TraceIdFilter)를 붙인다. 에러 응답의 traceId로 로그를 찾을 수 있다.
    correlation: "[%X{traceId:-}] "

springdoc:
  # OpenAPI 문서(/v3/api-docs)에는 공개 API 경로(/api/v1/**)만 포함한다.
  paths-to-match: /api/v1/**
