spring:
  lifecycle:
    # 종료 시 진행 중인 요청을 기다리는 최대 시간. compose의 stop_grace_period보다 짧게 유지한다.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  # 종료 신호를 받으면 새 요청은 거절하고, 처리 중인 요청이 끝날 때까지 기다린다.
  shutdown: graceful
  # Nginx 뒤에서 X-Forwarded-* 헤더를 신뢰해 원래 요청의 스킴과 호스트를 인식한다.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      probes:
        # /actuator/health/liveness, /actuator/health/readiness 활성화
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

remake:
  upload:
    # 배포 PR에서 공용 볼륨 경로(/data/uploads)를 넣는다. 운영에 임시 폴더 기본값을 쓰지 않는다.
    root-directory: ${REMAKE_UPLOAD_ROOT_DIRECTORY}
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
    cookie-secure: true
    access-cookie-name: ACCESS_TOKEN
    refresh-cookie-name: REFRESH_TOKEN
  oauth:
    mock-enabled: false
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  gemini:
    # AI 레시피·식단표 생성. 키는 배포 담당자가 서버 .env에 채운다. 비어 있으면 생성 요청만 AI_UPSTREAM_ERROR로 실패하고 앱은 정상 기동한다.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

