spring:
  config:
    # backend/.env 파일이 있으면 그 안의 값(DB 비밀번호 등)을 읽어 옴. 로컬 실행에서만 읽는다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로만 만든다. 운영과 같이 검사만 해서, SQL 파일을 빠뜨리면 로컬에서 바로 실패하게 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

remake:
  cors:
    # 로컬 프론트(pnpm dev)가 백엔드를 직접 부를 수 있게 허용한다. 운영은 같은 도메인이라 설정하지 않는다.
    allowed-origins: http://localhost:3000
  auth:
    # 로컬 전용 비밀키(32바이트 이상). 운영은 JWT_SECRET 환경 변수를 쓴다.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-key-32bytes-min}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
    # 로컬은 http://localhost 이라 Secure 쿠키를 끄고, 운영(application-prod)에서 켠다.
    cookie-secure: false
    access-cookie-name: ACCESS_TOKEN
    refresh-cookie-name: REFRESH_TOKEN
  gemini:
    # AI 레시피 생성. 키는 backend/.env의 GEMINI_API_KEY에 넣는다(커밋 금지). 비어 있으면 생성이 AI_UPSTREAM_ERROR로 실패한다.
    # 운영은 서버 .env의 GEMINI_API_KEY를 compose.prod.yml이 넘긴다(운영 전용 프로젝트 키, 로컬에서 쓰지 않는다).
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  oauth:
    # true면 네이버·카카오·구글 키 없이 code를 provider_user_id로 로그인한다. 실제 연동 때 false로 바꾸고 키를 넣는다.
    mock-enabled: ${OAUTH_MOCK_ENABLED:true}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

