spring:
  config:
    # backend/.env 파일이 있으면 그 안의 값(DB 비밀번호 등)을 읽어 옴. 로컬 실행에서만 읽는다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)으로만 만든다. 운영과 같이 검사만 해서, SQL 파일을 빠뜨리면 로컬에서 바로 실패하게 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

remake:
  cors:
    # 로컬 프론트(pnpm dev)가 백엔드를 직접 부를 수 있게 허용한다. 운영은 같은 도메인이라 설정하지 않는다.
    allowed-origins: http://localhost:3000
