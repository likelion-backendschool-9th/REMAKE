# 통합 테스트 설정. IntegrationTestSupport가 test 프로필을 켠다. (local 프로필 대신)
# backend/.env는 local 프로필에서만 읽으므로 테스트는 읽지 않는다. 테스트에 필요한 값은 여기에 둔다.
spring:
  jpa:
    hibernate:
      # 운영과 같이 검사만 한다. 마이그레이션 SQL과 엔티티가 맞지 않으면 테스트가 실패한다.
      ddl-auto: validate

remake:
  upload:
    # 개발·운영 파일과 분리한다. 테스트마다 파일을 지우고 공유 앱이 재사용하는 폴더는 남긴다.
    root-directory: ${java.io.tmpdir}/remake-test-uploads-${random.uuid}
  scheduling:
    # 테스트 중 @Scheduled 작업이 저절로 돌지 않게 한다. @Scheduled 설정은 ScheduledSettingsTest가 따로 검사한다.
    enabled: false
  cors:
    # 로컬과 같은 값. WebConfigTest가 허용 주소와 막는 주소를 확인한다.
    allowed-origins: http://localhost:3000
  auth:
    jwt-secret: test-only-secret-key-at-least-32-bytes!!
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
    cookie-secure: false
    access-cookie-name: ACCESS_TOKEN
    refresh-cookie-name: REFRESH_TOKEN
  oauth:
    # 통합 테스트는 SocialOAuthAdapter를 @MockitoBean으로 바꾸므로 실제 HTTP는 나가지 않는다.
    mock-enabled: false
    kakao:
      client-id: test-kakao-client
      client-secret: test-kakao-secret
      token-uri: http://localhost:1/oauth/token
      user-info-uri: http://localhost:1/v2/user/me
    naver:
      client-id: test-naver-client
      client-secret: test-naver-secret
      token-uri: http://localhost:1/oauth2.0/token
      user-info-uri: http://localhost:1/v1/nid/me
    google:
      client-id: test-google-client
      client-secret: test-google-secret
      token-uri: http://localhost:1/token
      user-info-uri: http://localhost:1/userinfo
  gemini:
    # 통합 테스트는 GeminiRecipeAdapter를 @MockitoBean으로 바꾸므로 실제 HTTP는 나가지 않는다.
    api-key: test-gemini-key
    model: test-model
    base-url: http://localhost:1
# 외부 서비스 키·주소는 연동이 생길 때 여기에 가짜 값으로 추가한다. 주소는 접속되지 않는 주소(http://localhost:1)로 둔다.
# 빠뜨리면 셸이나 IDE에 설정된 환경 변수의 진짜 키가 쓰일 수 있다.
