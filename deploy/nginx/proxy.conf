# 프록시 컨테이너(compose.prod.yml의 proxy)용 설정. 호스트 Nginx 설정이 아니다.
# 이 폴더(deploy/nginx)가 컨테이너의 /etc/nginx/conf.d 로 마운트되며, http 컨텍스트 안에서 읽힌다.

# 도커 내부 DNS. upstream 의 `resolve` 가 이 resolver 로 슬롯 이름을 주기적으로 다시 조회한다.
# 슬롯 컨테이너가 재시작되거나 서버가 재부팅되어 IP 가 바뀌어도 다음 배포 전까지 502 가 나지 않게 한다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 활성 슬롯 정의. 예: upstream remake_backend { zone ...; server backend-blue:8080 resolve; }
# 배포 스크립트가 이 파일을 backend-blue <-> backend-green 으로 바꾸고 reload 해서 전환한다.
include /etc/nginx/remake/upstream.conf;

# 앞단(호스트 Nginx)이 넘긴 X-Forwarded-Proto를 유지한다. 직접 접속처럼 헤더가 없으면 $scheme을 쓴다.
map $http_x_forwarded_proto $remake_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # 업로드 크기 제한은 영수증 이미지 크기를 정한 뒤 client_max_body_size 로 지정한다.

    # 헬스체크는 서버 안에서 컨테이너로 직접 하므로 외부에는 노출하지 않는다.
    location /actuator {
        return 404;
    }

    # deploy.sh 가 전환 직후 "새 슬롯이 응답하는지" 확인하는 내부 전용 경로.
    # 프록시 컨테이너 안(127.0.0.1)에서 보낸 요청만 허용한다. 호스트 포트를 거친 요청은
    # 도커 게이트웨이 주소에서 들어오므로 외부 사용자와 호스트 Nginx 는 접근할 수 없다.
    location = /__remake/upstream {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://remake_backend/actuator/health/readiness;
        # 이 요청을 실제로 받은 슬롯의 주소. 배포 스크립트가 새 슬롯 주소와 비교한다.
        add_header X-Remake-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://remake_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # 호스트 Nginx가 설정한 값을 그대로 전달한다.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $remake_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
