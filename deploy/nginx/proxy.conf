# 프록시 컨테이너(compose.prod.yml의 proxy)용 설정. 호스트 Nginx 설정이 아니다.
# 이 폴더(deploy/nginx)가 컨테이너의 /etc/nginx/conf.d 로 마운트되며, http 컨텍스트 안에서 읽힌다.

# 도커 내부 DNS. upstream 의 `resolve` 가 이 resolver 로 슬롯 이름을 주기적으로 다시 조회한다.
# 슬롯 컨테이너가 재시작되거나 서버가 재부팅되어 IP 가 바뀌어도 다음 배포 전까지 502 가 나지 않게 한다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 앱별 활성 슬롯 정의. 예: upstream remake_backend { zone ...; server backend-blue:8080 resolve; }
# 배포 스크립트가 앱마다 파일을 blue <-> green 으로 바꾸고 reload 해서 전환한다.
# 아직 배포하지 않은 앱은 아래 "준비 중" 서버(127.0.0.1:8081)를 가리킨다.
include /etc/nginx/remake/backend.conf;
include /etc/nginx/remake/frontend.conf;

# 앞단(호스트 Nginx)이 넘긴 X-Forwarded-Proto를 유지한다. 직접 접속처럼 헤더가 없으면 $scheme을 쓴다.
map $http_x_forwarded_proto $remake_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 아직 한 번도 배포하지 않은 앱의 자리. 프록시 컨테이너 안에서만 열린다.
server {
    listen 127.0.0.1:8081;
    return 503;
}

server {
    listen 80;
    server_name _;

    # 요청 본문 크기는 기본 1MB 그대로 두고, 업로드가 있는 /api/ 만 아래에서 32MB 로 늘린다.
    # 캐시(proxy_cache)는 두지 않는다. /serwist/sw.js 는 s-maxage 30일이 붙어 있어서
    # 공유 캐시에 남으면 배포한 뒤에도 예전 서비스 워커가 나간다. (frontend/blueprint.md §7)

    # 아래 location 들이 그대로 물려받는다. (location 안에서 proxy_set_header 를 쓰면 이 값들이 무시된다)
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # 호스트 Nginx가 설정한 값을 그대로 전달한다.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $remake_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # 헬스체크는 서버 안에서 컨테이너로 직접 하므로 외부에는 노출하지 않는다.
    location /actuator {
        return 404;
    }

    # deploy.sh 가 전환 직후 "새 슬롯이 응답하는지" 확인하는 내부 전용 경로. 앱마다 하나씩 있다.
    # 프록시 컨테이너 안(127.0.0.1)에서 보낸 요청만 허용한다. 호스트 포트를 거친 요청은
    # 도커 게이트웨이 주소에서 들어오므로 외부 사용자와 호스트 Nginx 는 접근할 수 없다.
    # X-Remake-Upstream: 이 요청을 실제로 받은 슬롯의 주소. 배포 스크립트가 새 슬롯 주소와 비교한다.
    location = /__remake/upstream/backend {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://remake_backend/actuator/health/readiness;
        add_header X-Remake-Upstream $upstream_addr always;
    }

    location = /__remake/upstream/frontend {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://remake_frontend/;
        add_header X-Remake-Upstream $upstream_addr always;
    }

    # 백엔드 API. 경로를 바꾸지 않고 그대로 넘긴다. (/api/items -> 백엔드의 /api/items)
    # 업로드(공유 사진·영수증 이미지) 크기: 앱의 Spring 제한(파일 10MB, 요청 30MB)보다 조금 크게 둔다.
    # 앱이 먼저 판단해 JSON 오류로 답하게 하려는 것이다. 같거나 작으면 Nginx 가 HTML 413 을 먼저 돌려준다.
    # 호스트 Nginx 는 server 블록 전체에 32m 를 두었다. /api/ 밖의 1MB 제한은 이 프록시가 맡는다.
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://remake_backend;
    }

    # 나머지는 모두 프론트(Next.js).
    location / {
        proxy_pass http://remake_frontend;
        # Next 는 화면을 나눠서 스트리밍으로 보낸다. 모아서 보내지 않고 받는 대로 바로 전달한다.
        proxy_buffering off;
    }
}
