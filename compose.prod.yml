# 무중단 배포용 구성 (Blue/Green).
# - backend-blue / backend-green: 같은 앱을 실행하는 두 슬롯. 호스트 포트는 열지 않고 내부 8080만 사용한다.
# - proxy: 배정받은 호스트 포트(APP_PORT) 하나를 받아 활성 슬롯으로 전달한다.
#   활성 슬롯은 서버의 ./proxy/upstream.conf 가 가리키며, 배포 스크립트가 이 파일을 바꿔 전환한다.
# - 슬롯 서비스는 항상 이름을 지정해서 실행한다. (이름 없이 `up -d`를 하면 두 슬롯이 모두 뜬다.)

x-backend: &backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    SPRING_PROFILES_ACTIVE: prod
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:?DB_NAME must be set}
    DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    TZ: Asia/Seoul
  # 앱의 graceful shutdown 대기(30초)보다 길어야 도커가 먼저 강제 종료하지 않는다.
  stop_grace_period: 40s
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-blue:
    <<: *backend
    build:
      context: ./backend
    # 슬롯마다 이미지 이름을 따로 둬서, 새 버전을 빌드해도 서비스 중인 슬롯의 이미지는 그대로 남는다.
    image: remake-backend-blue

  backend-green:
    <<: *backend
    build:
      context: ./backend
    image: remake-backend-green

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # 배정받은 포트를 서버의 .env에 APP_PORT로 입력한다. 값이 없으면 실행되지 않는다.
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set}:80"
    volumes:
      # 파일이 아니라 폴더를 마운트한다. 동기화(rsync)로 파일이 교체되어도 컨테이너가 바뀐 내용을 본다.
      # 이미지 기본 default.conf는 가려지고, 이 폴더의 proxy.conf만 읽힌다.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      # 활성 슬롯을 가리키는 upstream.conf. 서버에만 있고 배포 파일 동기화로 덮어쓰지 않는다.
      - ./proxy:/etc/nginx/remake:ro

volumes:
  postgres-data:
