# 무중단 배포용 구성 (Blue/Green). 백엔드와 프론트를 각각 따로 배포한다.
# - backend-blue / backend-green: 백엔드 슬롯 두 개. 호스트 포트는 열지 않고 내부 8080만 사용한다.
# - frontend-blue / frontend-green: 프론트 슬롯 두 개. 호스트 포트는 열지 않고 내부 3000만 사용한다.
# - proxy: 배정받은 호스트 포트(APP_PORT) 하나를 받아 /api/ 는 백엔드, 나머지는 프론트의 활성 슬롯으로 전달한다.
#   앱별 활성 슬롯은 서버의 ./proxy/backend.conf, ./proxy/frontend.conf 가 가리키며, 배포 스크립트가 바꿔 전환한다.
# - 슬롯 서비스는 항상 이름을 지정해서 실행한다. (이름 없이 `up -d`를 하면 모든 슬롯이 뜬다.)

# 프로젝트 이름을 고정한다. 없으면 서버 배포 폴더 이름이 쓰여서, 폴더 이름이 바뀌면
# DB 볼륨(remake_postgres-data)이 새로 만들어지고 같은 폴더 이름을 쓰는 다른 사이트와 섞일 수 있다.
name: remake

# 컨테이너 로그 크기 제한. 서버의 도커 기본 설정에는 제한이 없어 로그가 계속 쌓인다.
# 파일 하나가 10MB가 되면 새 파일로 넘기고 최근 3개만 남긴다(컨테이너당 최대 30MB). docker logs 는 그대로 쓸 수 있다.
# 컨테이너를 새로 만들 때 적용된다. 슬롯은 배포마다 새로 만들어지지만, postgres·proxy 는 직접 다시 만들어야 바뀐다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    SPRING_PROFILES_ACTIVE: prod
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:?DB_NAME must be set}
    DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
    KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    TZ: Asia/Seoul
    # 자바 힙을 컨테이너 메모리 상한의 75%까지 쓰게 한다. (기본 25%로는 상한 2g 에서 힙이 512MB 뿐이다)
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    # 업로드 파일(공유 사진 등) 저장 경로. 아래 uploads 볼륨이 붙는 자리와 같아야 한다. 비밀 값이 아니라 고정값으로 둔다.
    REMAKE_UPLOAD_ROOT_DIRECTORY: /data/uploads
  # 업로드 파일은 컨테이너가 아니라 볼륨(remake_uploads)에 둔다. 두 슬롯이 같은 볼륨을 써서
  # 배포로 슬롯이 바뀌어도 파일이 그대로 남는다. 볼륨은 슬롯 컨테이너를 새로 만들 때(다음 백엔드 배포) 붙는다.
  volumes:
    - uploads:/data/uploads

  # 공유 서버라 다른 팀 앱에 영향을 주지 않도록 메모리 상한을 둔다. 앱 크기에 비해 넉넉하게 잡았다.
  # 상한이 없으면 JVM 이 서버 전체 메모리의 1/4 까지 힙을 키울 수 있다. 바꾸면 다음 배포부터 적용된다.
  mem_limit: 2g
  # 앱의 graceful shutdown 대기(30초)보다 길어야 도커가 먼저 강제 종료하지 않는다.
  stop_grace_period: 40s
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-frontend: &frontend
  restart: unless-stopped
  logging: *logging
  environment:
    TZ: Asia/Seoul
  # 공유 서버라 메모리 상한을 둔다. Node 는 상한의 절반(1g 이면 약 512MB)을 힙 상한으로 자동으로 잡는다.
  # 측정한 사용량은 약 80MB 다. 바꾸면 다음 프론트 배포부터 적용된다.
  mem_limit: 1g
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-blue:
    <<: *backend
    build:
      context: ./backend
    # 슬롯마다 이미지 이름을 따로 둬서, 새 버전을 빌드해도 서비스 중인 슬롯의 이미지는 그대로 남는다.
    image: remake-backend-blue

  backend-green:
    <<: *backend
    build:
      context: ./backend
    image: remake-backend-green

  frontend-blue:
    <<: *frontend
    build: &frontend-build
      context: ./frontend
      # NEXT_PUBLIC_* 값은 빌드할 때 번들에 들어간다. API 주소(빈 값, 같은 도메인)와 MSW 끄기는
      # Dockerfile 의 기본값을 쓰고, 서버마다 다른 값만 .env 에서 넘긴다. 바꾸면 다시 빌드해야 적용된다.
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: remake-frontend-blue

  frontend-green:
    <<: *frontend
    build: *frontend-build
    image: remake-frontend-green

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      # 배정받은 포트를 서버의 .env에 APP_PORT로 입력한다. 값이 없으면 실행되지 않는다.
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set}:80"
    volumes:
      # 파일이 아니라 폴더를 마운트한다. 동기화(rsync)로 파일이 교체되어도 컨테이너가 바뀐 내용을 본다.
      # 이미지 기본 default.conf는 가려지고, 이 폴더의 proxy.conf만 읽힌다.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      # 앱별 활성 슬롯을 가리키는 backend.conf, frontend.conf. 서버에만 있고 배포 파일 동기화로 덮어쓰지 않는다.
      - ./proxy:/etc/nginx/remake:ro

volumes:
  postgres-data:
  # 업로드 파일. 프로젝트 이름이 remake 로 고정되어 있어 서버에서는 remake_uploads 가 된다. 이름을 바꾸면 빈 볼륨이 새로 생긴다.
  uploads:
