name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Frontend change detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect frontend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Frontend lint typecheck and build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Find pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Next.js(Turbopack)는 빌드한 결과를 .next/cache 에 남기고, 다음 빌드에서 바뀌지 않은 부분은 다시 컴파일하지 않는다.
      # CI는 매번 빈 폴더에서 시작하므로, dev 에 머지될 때 저장한 캐시 중 가장 최근 것을 꺼내 쓴다.
      # 의존성(pnpm-lock.yaml)이 바뀌면 이전 캐시를 쓰지 않고 새로 시작한다.
      - uses: actions/cache/restore@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      # PR에서는 저장하지 않는다. PR 캐시는 다른 PR이 쓰지 못하고 저장 한도(10GB)만 채운다.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}

  docker-build:
    name: Frontend Docker build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

  required:
    name: Frontend CI required
    needs: [changes, build, docker-build]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGED: ${{ needs.changes.outputs.changed }}
      DETECT_RESULT: ${{ needs.changes.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DOCKER_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Verify frontend checks
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo '::error::Frontend change detection failed'
            exit 1
          fi
          if [ "$CHANGED" = true ]; then
            if [ "$BUILD_RESULT" != success ]; then
              echo '::error::Frontend lint, typecheck, or build did not pass'
              exit 1
            fi
            if [ "$DOCKER_RESULT" != success ]; then
              echo '::error::Frontend Docker build did not pass'
              exit 1
            fi
          fi
