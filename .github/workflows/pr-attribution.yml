name: PR Attribution Check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-attribution:
    name: Check agent attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR description and commits
        run: python scripts/check_pr_attribution.py
