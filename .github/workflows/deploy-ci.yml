# 배포·CI 설정 파일 검사: 모든 PR에 검사 결과를 보고하고, 해당 파일이 바뀐 PR만 검사한다.
# - 배포 파일(compose.prod.yml, deploy/): 셸 스크립트, Compose, 프록시 Nginx 설정
# - 워크플로 파일(.github/workflows/): actionlint
# 이 검사가 없으면 이 파일들의 실수는 dev 에 머지된 뒤 CD 에서야 드러나고, 고칠 때까지 자동 배포가 막힌다.
name: Deploy CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: deploy-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Deploy change detection
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect deploy and workflow file changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if grep -Eq '^(deploy/|compose\.prod\.yml$|\.github/workflows/deploy-ci\.yml$)' <<<"$changed_files"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            echo 'workflows=true' >> "$GITHUB_OUTPUT"
          else
            echo 'workflows=false' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Deploy config check
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 서버 .env 는 PR 에서 볼 수 없다. compose.prod.yml 에 새 변수가 생기면 노란 경고로 알려서,
      # 머지 전에 배포 담당이 서버 .env 에 값을 넣게 한다. 필수 변수(${VAR:?})가 서버에 없으면
      # compose 가 파일 전체를 해석하지 못해 백엔드·프론트 배포와 롤백이 모두 멈춘다. 경고만 하고 실패시키지 않는다.
      - name: Warn about new environment variables
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/dev/docs/developer/deployment.md
        run: |
          set -euo pipefail
          # ${VAR...} 의 변수 이름. $${VAR} 는 compose 가 바꾸지 않는 글자 그대로의 값이라 뺀다.
          vars() { { grep -oP '(?<!\$)\$\{\K[A-Za-z_][A-Za-z0-9_]*' || true; } | sort -u; }
          is_required() { grep -qP "(?<!\\\$)\\\$\\{$1:\\?" compose.prod.yml; }
          base_vars="$RUNNER_TEMP/base-vars"
          head_vars="$RUNNER_TEMP/head-vars"
          git show "$BASE_SHA:compose.prod.yml" 2>/dev/null | vars > "$base_vars" || : > "$base_vars"
          vars < compose.prod.yml > "$head_vars"
          mapfile -t added < <(comm -13 "$base_vars" "$head_vars")
          if [ "${#added[@]}" -eq 0 ]; then
            echo 'compose.prod.yml 에 새 환경 변수가 없습니다.'
            exit 0
          fi
          {
          cat <<'EOF'
          ### 서버 `.env`에 먼저 넣어야 할 새 환경 변수

          머지 전에 배포 담당이 서버 `.env`에 값을 넣어야 합니다. 필수(`:?`) 변수가 서버에 없으면 백엔드·프론트 배포와 롤백이 모두 멈춥니다.
          EOF
            echo "자세한 순서: [배포 문서](${DOC_URL})"
            echo
            echo '| 변수 | 필수 |'
            echo '| --- | --- |'
            for name in "${added[@]}"; do
              if is_required "$name"; then required="예 (\`:?\`)"; else required='아니요 (빠지면 기본값)'; fi
              echo "| \`${name}\` | ${required} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for name in "${added[@]}"; do
            line="$(grep -nF -- "\${${name}" compose.prod.yml | head -n 1 | cut -d: -f1)"
            if is_required "$name"; then
              message="필수 변수입니다. 머지 전에 배포 담당이 서버 .env 에 ${name} 값을 넣어야 합니다. 없으면 백엔드·프론트 배포와 롤백이 모두 멈춥니다. PR 본문에서 배포 담당을 불러 주세요."
            else
              message="빠지면 기본값으로 동작합니다. 서버에 다른 값이 필요하면 머지 전에 배포 담당에게 알려 주세요."
            fi
            echo "::warning file=compose.prod.yml,line=${line:-1},title=새 환경 변수 ${name}::${message}"
          done

      - name: Check shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find deploy -name '*.sh' -type f | sort)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

      # 서버 .env 의 예시(prod.env.example)에서 빈 값만 임시 값으로 채워 검사한다.
      # compose 에 필수 변수(${VAR:?})를 새로 넣고 예시 파일에 빠뜨리면 여기서 실패한다.
      - name: Check Compose configuration
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/ci.env"
          sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)=$/\1=ci-only-value/' deploy/prod.env.example > "$env_file"
          # APP_PORT 는 포트 번호여야 compose 가 해석할 수 있다.
          sed -i -E 's/^APP_PORT=.*/APP_PORT=18080/' "$env_file"
          docker compose --env-file "$env_file" -f compose.prod.yml config --quiet

      # 서버에서 deploy.sh 가 전환 전에 하는 검사와 같은 명령으로 프록시 설정을 검사한다.
      # proxy/<앱>.conf 는 서버에만 있으므로, deploy.sh 의 write_upstream_file 이 쓰는 두 가지 모양을 만들어 각각 검사한다.
      - name: Check proxy Nginx configuration
        run: |
          set -euo pipefail
          # 앞 단계에서 만든 임시 env 파일을 그대로 쓴다.
          compose=(docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.prod.yml)
          mkdir -p proxy
          for variant in slot placeholder; do
            for app in backend frontend; do
              case "$app" in backend) port=8080 ;; frontend) port=3000 ;; esac
              if [[ "$variant" == slot ]]; then
                server="server $app-blue:$port resolve;"
              else
                server="server 127.0.0.1:8081;"
              fi
              printf 'upstream remake_%s {\n    zone remake_%s 64k;\n    %s\n}\n' "$app" "$app" "$server" > "proxy/$app.conf"
            done
            echo "== $variant"
            "${compose[@]}" run --rm --no-deps -T --entrypoint nginx proxy -t
          done

  # 워크플로 파일은 GitHub이 실행할 때가 되어서야 오류를 알려 준다. 문법, 그 자리에서 쓸 수 없는 값,
  # 없는 작업을 가리키는 needs, run 스크립트(shellcheck 포함), 외부 입력을 스크립트에 그대로 넣는 위험을 머지 전에 검사한다.
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

  required:
    name: Deploy CI required
    needs: [changes, check, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    env:
      DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
      WORKFLOWS_CHANGED: ${{ needs.changes.outputs.workflows }}
      DETECT_RESULT: ${{ needs.changes.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      LINT_RESULT: ${{ needs.workflow-lint.result }}
    steps:
      - name: Verify deploy checks
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo '::error::Deploy change detection failed'
            exit 1
          fi
          if [ "$DEPLOY_CHANGED" = true ] && [ "$CHECK_RESULT" != success ]; then
            echo '::error::Deploy config check did not pass'
            exit 1
          fi
          if [ "$WORKFLOWS_CHANGED" = true ] && [ "$LINT_RESULT" != success ]; then
            echo '::error::Workflow lint did not pass'
            exit 1
          fi
