# 백엔드 CI: 모든 PR에 검사 결과를 보고하고, 백엔드 변경 시에만 빌드한다.
name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      # 마크다운(AGENTS.md, README.md 등)만 바뀐 변경은 빌드·검사·배포에 영향이 없어 건너뛴다.
      - '!backend/**/*.md'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Backend change detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 마크다운(backend/ 아래 README.md 등)만 바뀐 PR은 빌드에 영향이 없어 검사하지 않는다. (push 는 on.paths 에서 같은 기준)
          # compose.prod.yml 과 deploy/prod.env.example 은 아래 운영 설정 기동 확인이 쓰는 파일이다. 백엔드에 넘기는 환경 변수를
          # 바꾸는 PR이 바로 그 확인이 필요한 경우라서, 이 파일만 바뀐 PR도 검사한다.
          # git diff 가 실패하면 여기서 작업이 실패한다(검사를 조용히 건너뛰지 않게). grep 은 남는 파일이 없을 때만 1 이라 무시한다.
          diff_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          changed_files="$(grep -Ev '^backend/.*\.md$' <<<"$diff_files" || true)"
          if grep -Eq '^(backend/|compose\.prod\.yml$|deploy/prod\.env\.example$|\.github/workflows/backend-ci\.yml$|scripts/(backend_test_summary|check_migrations)\.py$)' <<<"$changed_files"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend build and test
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # 테스트용 PostgreSQL은 테스트가 Testcontainers로 직접 띄운다(러너에 Docker가 있음). docs/agent/backend-testing.md
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      # 테스트 시간과 Spring 앱 기동 횟수를 작업 요약에 표로 남긴다. 기준을 넘으면 노란 경고만 띄우고 실패시키지 않는다.
      # 기동 횟수가 테스트 클래스 수에 가까워지면 통합 테스트가 앱을 재사용하지 못해 CI가 점점 느려진다.
      # 기동 기준은 테스트 부모 클래스 수(지금 1)다. 새 부모 클래스를 만드는 PR에서 같이 올린다.
      - name: Test summary
        if: always() && steps.build.outcome != 'skipped'
        # 요약은 보조 기능이다. 스크립트에 문제가 생겨도 작업을 실패시키지 않는다. (테스트 실패는 위 단계에서 그대로 실패한다)
        continue-on-error: true
        run: python3 ../scripts/backend_test_summary.py build/test-results/test --max-spring-boots 1 --max-test-seconds 180

      # 테스트가 실패하면 HTML 리포트를 올린다. 실행 화면의 Artifacts 에서 받아 build/reports 의 index.html 을 연다.
      - name: Upload test report
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  # 테스트는 빈 DB에서 시작하므로, 서버 DB(dev 에 머지된 마이그레이션이 모두 적용됨)에서만 실패하는 경우를 못 잡는다.
  # 번호 겹침·역전, 이미 적용된 파일 수정을 검사하는 순간의 최신 base 브랜치와 비교해서 잡는다.
  # PR 을 연 시점이 아니라 지금의 base 와 비교하므로, 머지 직전에 Re-run 하면 승인을 유지한 채 다시 확인할 수 있다.
  migrations:
    name: Backend migration check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check migrations against the latest base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/check_migrations.py "origin/$BASE_REF" "$HEAD_SHA"

  docker-build:
    name: Backend Docker build and start
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # Dockerfile의 Gradle 보관 폴더(RUN --mount=type=cache,target=/root/.gradle)는 빌드한 컴퓨터에만 남는다.
      # 러너는 매번 새 컴퓨터라 Gradle과 라이브러리를 매번 새로 받다가 Maven Central 요청 제한(429)에 걸린 적이 있다.
      # 그래서 보관 폴더를 GitHub 캐시에 두고 빌드 전에 넣는다. 캐시 용량 때문에 저장은 dev 머지 때만 한다.
      - name: Restore Gradle cache for Docker build
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: backend-docker-gradle
          key: backend-docker-gradle-${{ hashFiles('backend/build.gradle', 'backend/settings.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: backend-docker-gradle-
      # 저장은 뒷정리(post) 단계에서 한다. 뒷정리는 단계의 역순으로 돌기 때문에 이 단계가 아래 cache-dance보다 앞에 있어야
      # "빌드 뒤 보관 폴더 꺼내기 → 저장" 순서가 된다.
      - name: Cache Gradle for Docker build
        if: github.event_name == 'push'
        id: gradle-cache
        uses: actions/cache@v6
        with:
          path: backend-docker-gradle
          key: backend-docker-gradle-${{ hashFiles('backend/build.gradle', 'backend/settings.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: backend-docker-gradle-
      # 캐시 도구가 실패해도 빌드는 지금처럼(캐시 없이) 진행한다.
      - name: Inject Gradle cache into Docker build
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"backend-docker-gradle": "/root/.gradle"}'
          utility-image: ghcr.io/containerd/busybox@sha256:52f73a0a43a16cf37cd0720c90887ce972fe60ee06a687ee71fb93a7ca601df7
          skip-extraction: ${{ github.event_name != 'push' || steps.gradle-cache.outputs.cache-hit == 'true' }}
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          # PR에서는 아래 기동 확인에 쓰도록 러너의 Docker에 이미지를 남긴다. 이름은 compose.prod.yml 의 슬롯 이미지와 같다.
          load: ${{ github.event_name == 'pull_request' }}
          tags: remake-backend-blue
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}
          # 새 캐시를 저장하는 dev 실행에서는 build 단계를 층 캐시 없이 다시 돌려 Gradle이 실제로 받게 한다.
          # (층 캐시로 bootJar 줄을 건너뛰면 보관 폴더가 빈 채로 저장된다)
          no-cache-filters: ${{ github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true' && 'build' || '' }}

      # 방금 만든 이미지를 서버의 deploy/deploy.sh 가 새 슬롯을 띄울 때와 같은 방법(compose.prod.yml, prod 프로필,
      # 같은 헬스체크)으로 띄워 본다. 테스트는 외부 연동을 가짜로 바꾸고 테스트 설정으로 돌기 때문에, 운영 설정에서만
      # 앱이 뜨지 않는 문제(예: #132 의 RestClient 의존성 누락)는 머지 뒤 서버에서야 드러나고 고칠 때까지 배포가 막혔다.
      # 러너 안에서만 띄우고, 서버나 외부 서비스에는 접속하지 않는다. dev 에서는 CD 가 서버에서 실제로 띄우므로 PR에서만 한다.
      - name: Start backend with production settings
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # 서버 .env 대신 예시 파일의 빈 값을 임시 값으로 채운다(Deploy CI 의 compose 검사와 같은 방식).
          # JWT_SECRET 은 32바이트 이상이어야 앱이 뜬다(HMAC-SHA 키). APP_PORT 는 띄우지 않는 프록시용이지만 compose 해석에 필요하다.
          # 형식이 정해진 필수 값(숫자, 주소 등)이 새로 생기면 여기서 그 형식에 맞는 임시 값을 넣는다.
          env_file="$RUNNER_TEMP/ci.env"
          sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)=$/\1=ci-only-value/' deploy/prod.env.example > "$env_file"
          sed -i -E 's/^APP_PORT=.*/APP_PORT=18080/; s/^JWT_SECRET=.*/JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes/' "$env_file"
          compose=(docker compose --env-file "$env_file" -f compose.prod.yml)
          "${compose[@]}" up -d --wait postgres
          # deploy.sh 의 start_slot 과 같은 명령. 이미지는 위 단계에서 만든 것을 쓴다(--no-build). 대기 시간도 서버와 같다(180초).
          if ! "${compose[@]}" up -d --no-deps --no-build --wait --wait-timeout 180 backend-blue; then
            echo '::error title=운영 설정으로 백엔드가 뜨지 않음::서버에서도 같은 이유로 새 버전이 뜨지 않습니다. 아래 앱 로그(APPLICATION FAILED TO START 부분)에서 원인을 확인하세요.'
            "${compose[@]}" ps -a
            "${compose[@]}" logs --no-color --tail 200 backend-blue || true
            exit 1
          fi
          echo '운영 설정으로 백엔드가 떴고 서버와 같은 헬스체크(/actuator/health/readiness)를 통과했습니다.'

  required:
    name: Backend CI required
    needs: [changes, build, migrations, docker-build]
    if: always()
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGED: ${{ needs.changes.outputs.changed }}
      DETECT_RESULT: ${{ needs.changes.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      MIGRATION_RESULT: ${{ needs.migrations.result }}
      DOCKER_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Verify backend checks
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo '::error::Backend change detection failed'
            exit 1
          fi
          if [ "$CHANGED" = true ]; then
            if [ "$EVENT_NAME" = pull_request ] && [ "$BUILD_RESULT" != success ]; then
              echo '::error::Backend build and test did not pass'
              exit 1
            fi
            if [ "$EVENT_NAME" = pull_request ] && [ "$MIGRATION_RESULT" != success ]; then
              echo '::error::Backend migration check did not pass'
              exit 1
            fi
            if [ "$DOCKER_RESULT" != success ]; then
              echo '::error::Backend Docker build or production start check did not pass'
              exit 1
            fi
          fi
