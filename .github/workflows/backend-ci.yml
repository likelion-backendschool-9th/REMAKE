# 백엔드 CI: 모든 PR에 검사 결과를 보고하고, 백엔드 변경 시에만 빌드한다.
name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Backend change detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(backend/|\.github/workflows/backend-ci\.yml$|scripts/backend_test_summary\.py$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend build and test
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # 테스트용 일회용 PostgreSQL (검사가 끝나면 사라짐)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: remake
          POSTGRES_USER: remake
          POSTGRES_PASSWORD: remake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # application-local.yml이 읽는 값 (CI 전용 임시 값)
    env:
      DB_PORT: 5432
      DB_NAME: remake
      DB_USERNAME: remake
      DB_PASSWORD: remake

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      # 테스트 시간과 Spring 앱 기동 횟수를 작업 요약에 표로 남긴다. 기준을 넘으면 노란 경고만 띄우고 실패시키지 않는다.
      # 기동 횟수가 테스트 클래스 수에 가까워지면 통합 테스트가 앱을 재사용하지 못해 CI가 점점 느려진다.
      - name: Test summary
        if: always() && steps.build.outcome != 'skipped'
        run: python3 ../scripts/backend_test_summary.py build/test-results/test --max-spring-boots 3 --max-test-seconds 180

      # 테스트가 실패하면 HTML 리포트를 올린다. 실행 화면의 Artifacts 에서 받아 build/reports 의 index.html 을 연다.
      - name: Upload test report
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    name: Backend Docker build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

  required:
    name: Backend CI required
    needs: [changes, build, docker-build]
    if: always()
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGED: ${{ needs.changes.outputs.changed }}
      DETECT_RESULT: ${{ needs.changes.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DOCKER_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Verify backend checks
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo '::error::Backend change detection failed'
            exit 1
          fi
          if [ "$CHANGED" = true ]; then
            if [ "$EVENT_NAME" = pull_request ] && [ "$BUILD_RESULT" != success ]; then
              echo '::error::Backend build and test did not pass'
              exit 1
            fi
            if [ "$DOCKER_RESULT" != success ]; then
              echo '::error::Backend Docker build did not pass'
              exit 1
            fi
          fi
