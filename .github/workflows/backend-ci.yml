# 백엔드 CI: 모든 PR에 검사 결과를 보고하고, 백엔드 변경 시에만 빌드한다.
name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Backend change detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(backend/|\.github/workflows/backend-ci\.yml$|scripts/(backend_test_summary|check_migrations)\.py$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend build and test
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # 테스트용 PostgreSQL은 테스트가 Testcontainers로 직접 띄운다(러너에 Docker가 있음). docs/agent/backend-testing.md
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      # 테스트 시간과 Spring 앱 기동 횟수를 작업 요약에 표로 남긴다. 기준을 넘으면 노란 경고만 띄우고 실패시키지 않는다.
      # 기동 횟수가 테스트 클래스 수에 가까워지면 통합 테스트가 앱을 재사용하지 못해 CI가 점점 느려진다.
      # 기동 기준은 테스트 부모 클래스 수(지금 1)다. 새 부모 클래스를 만드는 PR에서 같이 올린다.
      - name: Test summary
        if: always() && steps.build.outcome != 'skipped'
        # 요약은 보조 기능이다. 스크립트에 문제가 생겨도 작업을 실패시키지 않는다. (테스트 실패는 위 단계에서 그대로 실패한다)
        continue-on-error: true
        run: python3 ../scripts/backend_test_summary.py build/test-results/test --max-spring-boots 1 --max-test-seconds 180

      # 테스트가 실패하면 HTML 리포트를 올린다. 실행 화면의 Artifacts 에서 받아 build/reports 의 index.html 을 연다.
      - name: Upload test report
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  # 테스트는 빈 DB에서 시작하므로, 서버 DB(dev 에 머지된 마이그레이션이 모두 적용됨)에서만 실패하는 경우를 못 잡는다.
  # 번호 겹침·역전, 이미 적용된 파일 수정을 검사하는 순간의 최신 base 브랜치와 비교해서 잡는다.
  # PR 을 연 시점이 아니라 지금의 base 와 비교하므로, 머지 직전에 Re-run 하면 승인을 유지한 채 다시 확인할 수 있다.
  migrations:
    name: Backend migration check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check migrations against the latest base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/check_migrations.py "origin/$BASE_REF" "$HEAD_SHA"

  docker-build:
    name: Backend Docker build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

  required:
    name: Backend CI required
    needs: [changes, build, migrations, docker-build]
    if: always()
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGED: ${{ needs.changes.outputs.changed }}
      DETECT_RESULT: ${{ needs.changes.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      MIGRATION_RESULT: ${{ needs.migrations.result }}
      DOCKER_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Verify backend checks
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo '::error::Backend change detection failed'
            exit 1
          fi
          if [ "$CHANGED" = true ]; then
            if [ "$EVENT_NAME" = pull_request ] && [ "$BUILD_RESULT" != success ]; then
              echo '::error::Backend build and test did not pass'
              exit 1
            fi
            if [ "$EVENT_NAME" = pull_request ] && [ "$MIGRATION_RESULT" != success ]; then
              echo '::error::Backend migration check did not pass'
              exit 1
            fi
            if [ "$DOCKER_RESULT" != success ]; then
              echo '::error::Backend Docker build did not pass'
              exit 1
            fi
          fi
