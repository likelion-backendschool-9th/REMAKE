name: 기능 개발
description: 요구사항·확정 사항·작업 범위와 실제 구현할 내용을 구분합니다.
title: "[feat] "
labels: ["feat"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 지금 무엇이 안 되거나 불편한지, 이 기능이 왜 필요한지 적어 주세요.
      placeholder: 냉장고 재료를 썼거나 버린 뒤에도 수량이 그대로여서 실제 남은 재료를 알기 어렵다.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 사용자가 할 수 있어야 하는 것과 시스템이 보장할 결과를 적어 주세요. 실패·경계 상황도 포함하고 각 항목을 확인하면 완료 여부를 판단할 수 있게 씁니다.
      placeholder: |
        - 회원이 사용 또는 버림을 선택하면 입력한 만큼 재료 수량이 줄어든다.
        - 가진 양보다 많이 차감하면 거절되고 기존 수량은 바뀌지 않는다.
        - 전부 사용한 재료는 목록에서 사라져도 기록은 남는다.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 정한 것
      description: 이미 확정된 정책·API 계약·기술 선택과 그 근거를 적어 주세요. 제안이나 미답변 댓글은 여기에 넣지 않습니다. 확정된 내용이 없으면 생략합니다.
      placeholder: |
        - …은 …로 처리한다. 근거: 문서의 절 또는 결정 이슈 링크
        - 요청·응답 계약: 재료 사용·폐기 — POST /api/v1/user/ingredients/{id}/consume
        - 요청·응답에서 확인할 필드: …
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이 이슈와 PR 하나에서 맡을 범위와 다른 이슈가 맡는 범위를 구분해 주세요. 제외할 작업은 해당 이슈도 연결합니다.
      placeholder: |
        - 포함: 재료 사용·폐기 API와 서버 수량 반영
        - 제외: 사용 시트 FE(#이슈번호), 요리 완료 흐름(#이슈번호)
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: 구현할 것
      description: 이번 범위에서 추가·변경할 API·서버 처리·화면·연동을 체크리스트로 적어 주세요. 필요한 오류·이벤트·테스트도 구체적인 대상과 함께 적습니다. 정의서를 통째로 옮기거나 제목을 반복하지 않습니다.
      placeholder: |
        - [ ] 사용·폐기 요청을 받아 본인 재료의 잔량을 검증하고 차감한다.
        - [ ] 수량 반영과 사용·폐기 기록 저장을 한 트랜잭션으로 처리한다.
        - [ ] 초과 차감·전량 차감·가격 없는 재료의 처리 결과를 테스트한다.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 확인할 것
      description: 아직 정하지 못한 질문·문서 충돌·선행 작업만 적어 주세요. 확인할 사람·필요한 시점·막히는 작업을 명시하고, 독립적인 정책 결정은 결정 이슈로 연결합니다. 없으면 생략합니다.
      placeholder: |
        - 미결: … / 확인할 사람: @아이디 / 필요한 시점: … 구현 전
        - 선행: #이슈번호의 … 완료 후 … 연결 가능
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 참고
      description: 관련 문서의 절, 피그마 프레임 이름·링크, 관련 이슈·PR을 연결합니다. API는 정의서 번호 대신 기능명·HTTP 메서드·전체 경로를 함께 적습니다. 후속이면 원인 PR과 follow-up 라벨을 연결하고 영역·파트·우선순위는 라벨로 표시합니다.
      placeholder: |
        - 근거: 영역 가이드 링크와 해당 절
        - API: 남은 생성 횟수 조회 — GET /api/v1/user/usage-quotas
        - 화면: 피그마 프레임 이름과 직접 링크
        - 이어지는 PR: #PR번호(후속 작업일 때)
    validations:
      required: false
